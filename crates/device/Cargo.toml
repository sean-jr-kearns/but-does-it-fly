[package]
name = "device"
version = "0.1.0"
edition = "2024"

[dependencies]

bluer = { version = "0.17.4", features = ["bluetoothd"] }
communication-protocol = { path = "../libraries/protocol" }
env_logger = "0.11"
futures = "0.3"
safety-lights = { path = "../libraries/safety_lights" }
telemetry = { path = "../libraries/telemetry" }
tokio = { version = "1", features = ["macros", "rt", "signal", "sync"] }

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
