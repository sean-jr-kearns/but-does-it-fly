[package]
name = "station"
version = "0.1.0"
edition = "2024"

[dependencies]

btleplug = "0.13.0"
communication-protocol = { path = "../libraries/protocol" }
futures = "0.3"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
] }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = "0.3"
uuid = "1"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
