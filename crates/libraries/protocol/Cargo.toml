[package]
name = "communication-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
postcard = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = { version = "0.1", default-features = false }
uuid = "1"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
