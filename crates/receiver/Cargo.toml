[package]
name = "receiver"
version = "0.1.0"
edition = "2024"

[dependencies]
communication-protocol = { path = "../protocol" }

bluer = { version = "0.17.4", features = ["bluetoothd"] }
env_logger = "0.11"
futures = "0.3"
log = "0.4"
rppal = "0.22.1"
tokio = { version = "1", features = ["macros", "rt", "signal", "sync"] }

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
