[package]
name = "sender"
version = "0.1.0"
edition = "2024"

[dependencies]
communication-protocol = { path = "../protocol" }

btleplug = "0.13.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures = "0.3"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
